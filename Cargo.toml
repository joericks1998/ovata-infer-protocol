[package]
name = "ovata-infer-protocol"
version = "0.5.2"
edition = "2021"
license = "MIT"
description = "Protocol for local LLM inference: request/response types, the frame codec, and the provider C-ABI a caller loads."
repository = "https://github.com/joericks1998/ovata-infer-protocol"

# Deliberately tiny, and it must stay that way.
#
# Two repositories build this crate — the inference daemon (as a submodule) and
# the Jade language (as a git dependency) — and neither can see the other. A
# dependency added here is one both must carry, so nothing beyond serde belongs.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
